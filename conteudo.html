<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Clube Morpheus</title>
  <link rel="icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,700&display=swap" rel="stylesheet" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: "DM Sans", sans-serif;
      background-color: white;
      color: black;
      display: flex;
      flex-direction: column;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: rgba(0, 0, 0, 0.9);
      padding: 10px 20px;
      position: fixed;
      width: 100%;
      top: 0;
      left: 0;
      z-index: 3;
      color: white;
      box-sizing: border-box;
    }

    .navbar .welcome {
      font-weight: bold;
      white-space: nowrap;
      font-size: 16px;
    }

    .navbar .links {
      display: flex;
      gap: 20px;
      flex-wrap: nowrap;
      white-space: nowrap;
      padding-left: 4px;
    }

    .navbar a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
      display: inline-block;
      transition: transform 0.2s ease-in-out;
    }

    .navbar a:hover {
      transform: scale(1.1);
      color: white;
    }

    /* ESTILOS PARA SMARTPHONE VERTICAL */
    .mobile-device .navbar {
      padding: 18px 20px;
      min-height: 75px;
    }

    .mobile-device .navbar .welcome {
      font-size: 24px;
      font-weight: bold;
    }

    .mobile-device .navbar .links {
      gap: 20px;
    }

    .mobile-device .navbar a {
      font-size: 24px;
      font-weight: bold;
    }

    /* ESTILOS PARA SMARTPHONE HORIZONTAL */
    .mobile-landscape .navbar {
      padding: 12px 20px;
    }

    .mobile-landscape .navbar .welcome {
      font-size: 18px;
    }

    .mobile-landscape .navbar .links {
      gap: 15px;
    }

    .mobile-landscape .navbar a {
      font-size: 18px;
    }

    /* ESTILOS PARA COMPUTADOR (DEFAULT) */
    .desktop-device .navbar {
      padding: 10px 20px;
    }

    .desktop-device .navbar .welcome {
      font-size: 16px;
    }

    .desktop-device .navbar .links {
      gap: 20px;
    }

    .desktop-device .navbar a {
      font-size: 16px;
    }

    @media (max-width: 768px) {
      .navbar {
        padding: 8px 15px;
      }

      .navbar .welcome {
        font-size: 14px;
      }

      .navbar .links {
        gap: 10px;
      }

      .navbar a {
        font-size: 14px;
      }
    }

    /* OCULTAR INFORMAÇÃO DO DISPOSITIVO */
    #deviceInfo {
      display: none !important;
    }

    /* =============================
       ESTILOS DA ÁREA DE CONTEÚDO
       ============================= */
    #conteudo-wrapper {
      margin-top: 60px;
      padding: 30px 20px;
      max-width: 800px;
      width: 100%;
      box-sizing: border-box;
      margin-left: auto;
      margin-right: auto;
    }

    .mobile-device #conteudo-wrapper {
      margin-top: 75px;
      padding: 20px 15px;
    }

    /* CARD DO VÍDEO */
    .video-card {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      gap: 18px;
      padding: 18px 0;
      cursor: pointer;
      color: black;
      transition: opacity 0.2s ease;
    }

    .video-card:hover {
      opacity: 0.8;
    }

    /* WRAPPER DA THUMB COM ÍCONE DE PLAY */
    .thumb-wrapper {
      position: relative;
      width: 200px;
      min-width: 200px;
      aspect-ratio: 16 / 9;
      border-radius: 6px;
      overflow: hidden;
      background-color: #111;
      flex-shrink: 0;
    }

    .video-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ÍCONE DE PLAY SOBRE A THUMB */
    .play-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 48px;
      height: 48px;
      background-color: rgba(0, 0, 0, 0.65);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      transition: background-color 0.2s ease;
    }

    .video-card:hover .play-icon {
      background-color: rgba(200, 0, 0, 0.9);
    }

    .play-icon svg {
      width: 20px;
      height: 20px;
      fill: white;
      margin-left: 3px;
    }

    .video-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
    }

    .video-titulo {
      font-size: 16px;
      font-weight: 700;
      margin: 0;
      line-height: 1.3;
    }

    .video-descricao {
      font-size: 14px;
      margin: 0;
      color: #444;
      line-height: 1.4;
    }

    .video-data {
      font-size: 12px;
      color: #888;
      margin: 0;
    }

    .video-divider {
      border: none;
      border-top: 1px solid #e0e0e0;
      margin: 0;
    }

    #conteudo-loading {
      text-align: center;
      padding: 40px 0;
      color: #888;
      font-size: 15px;
    }

    #conteudo-erro {
      text-align: center;
      padding: 40px 0;
      color: #c00;
      font-size: 15px;
      display: none;
    }

    /* MOBILE VERTICAL */
    .mobile-device .video-card {
      flex-direction: column;
      gap: 12px;
    }

    .mobile-device .thumb-wrapper {
      width: 100%;
      min-width: unset;
    }

    .mobile-device .video-titulo {
      font-size: 18px;
    }

    .mobile-device .video-descricao {
      font-size: 16px;
    }

    .mobile-device .video-data {
      font-size: 14px;
    }

    /* MOBILE LANDSCAPE */
    .mobile-landscape .thumb-wrapper {
      width: 180px;
      min-width: 180px;
    }

    .mobile-landscape .video-titulo {
      font-size: 15px;
    }

    /* =============================
       MODAL DO PLAYER
       ============================= */
    #video-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background-color: rgba(0, 0, 0, 0.82);
      align-items: center;
      justify-content: center;
    }

    #video-modal.aberto {
      display: flex;
    }

    #modal-inner {
      position: relative;
      width: 90vw;
      max-width: 900px;
    }

    #modal-titulo {
      color: white;
      font-size: 15px;
      font-weight: 700;
      margin: 0 0 10px 0;
      padding-right: 36px;
      line-height: 1.3;
    }

    #modal-frame-wrapper {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
    }

    #modal-frame-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    #modal-fechar {
      position: absolute;
      top: 0;
      right: 0;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      line-height: 1;
    }

    #modal-fechar svg {
      width: 26px;
      height: 26px;
      display: block;
    }

    #modal-fechar:hover svg path {
      stroke: #ccc;
    }

    @media (max-width: 600px) {
      #modal-inner {
        width: 96vw;
      }

      #modal-titulo {
        font-size: 13px;
      }
    }

    /* =============================
       VISIBILIDADE (SÓ PARA O MASTER)
       ============================= */
    .visib-bloco {
      /* alinhado ao texto do card: thumb 200px + gap 18px */
      margin: -6px 0 18px 218px;
    }

    .mobile-device .visib-bloco {
      margin-left: 0;
    }

    .visib-barra {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 14px;
    }

    .visib-resumo {
      font-size: 13px;
      color: #888;
    }

    .visib-resumo.parcial {
      color: #164CAD;
      font-weight: 700;
    }

    .visib-resumo.nenhum {
      color: #c00;
      font-weight: 700;
    }

    .visib-btn {
      border: none;
      border-radius: 6px;
      padding: 7px 12px;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
    }

    .visib-btn-secundario {
      background: #e9edf5;
      color: #222;
    }

    .visib-btn-secundario:hover {
      background: #dde3ee;
    }

    .visib-btn-primario {
      background: #164CAD;
      color: white;
    }

    .visib-btn-primario:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .visib-painel {
      margin-top: 12px;
    }

    .visib-botoes {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    .visib-lista {
      border: 1px solid #ddd;
      border-radius: 8px;
      max-height: 300px;
      overflow-y: auto;
    }

    .visib-cotista {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    .visib-cotista:last-child {
      border-bottom: none;
    }

    .visib-cotista input {
      width: 18px;
      height: 18px;
      margin: 0;
      flex-shrink: 0;
      cursor: pointer;
    }

    .visib-nome {
      font-size: 14px;
      font-weight: 700;
    }

    .visib-email {
      font-size: 13px;
      color: #666;
      margin-top: 2px;
    }

    .visib-rodape {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 10px;
    }

    .visib-contador {
      font-size: 13px;
      color: #666;
    }

    .visib-status {
      font-size: 13px;
    }

    .visib-status.ok {
      color: #1a7f37;
    }

    .visib-status.erro {
      color: #c00;
    }

    .visib-aviso {
      text-align: center;
      color: #c00;
      font-size: 14px;
      margin: 0 0 10px 0;
    }

    .mobile-device .visib-resumo,
    .mobile-device .visib-btn,
    .mobile-device .visib-contador,
    .mobile-device .visib-status {
      font-size: 15px;
    }

    .mobile-device .visib-btn {
      padding: 10px 14px;
    }

    .mobile-device .visib-nome {
      font-size: 16px;
    }

    .mobile-device .visib-email {
      font-size: 14px;
    }

    .mobile-device .visib-cotista input {
      width: 22px;
      height: 22px;
    }
  </style>
</head>
<body>

    <div class="links">

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged,
    } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
    import {
      getFirestore,
      doc,
      getDoc,
      collection,
      getDocs,
      writeBatch,
      arrayUnion,
      arrayRemove,
    } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAYLyEfTVl8zR1drcNYi7K33IT6ytVJYJ8",
      authDomain: "login-site-9cbbd.firebaseapp.com",
      projectId: "login-site-9cbbd",
      storageBucket: "login-site-9cbbd.appspot.com",
      messagingSenderId: "703993528666",
      appId: "1:703993528666:web:1e7a02cb5b611e24c97363",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Conta master: vê todos os conteúdos e escolhe quais cotistas veem cada um.
    // Para cada cotista, os ids dos vídeos ocultos ficam em usuarios/{uid}.conteudosOcultos
    const EMAIL_MASTER = "gabrielssimon7@gmail.com";

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        let ocultos = null; // continua null se não der para ler o cadastro

        try {
          const docRef = doc(db, "usuarios", user.uid);
          const docSnap = await getDoc(docRef);

          if (docSnap.exists()) {
            const data = docSnap.data();
            const nome = data.nome || "Usuário";
            const genero = (data.genero || "masculino").toLowerCase();
            const saudacao = genero === "feminino" ? "Bem-vinda" : "Bem-vindo";
            document.getElementById("welcomeUser").textContent = `${saudacao}, ${nome}`;
            ocultos = Array.isArray(data.conteudosOcultos) ? data.conteudosOcultos : [];
          } else {
            document.getElementById("welcomeUser").textContent = "Bem-vindo(a), Usuário";
            ocultos = [];
          }
        } catch (error) {
          document.getElementById("welcomeUser").textContent = "Bem-vindo(a), Usuário";
        }

        if (user.email === EMAIL_MASTER) {
          window.definirAcessoConteudo(await montarAcessoMaster(user.uid));
        } else if (ocultos === null) {
          // Sem o cadastro não dá para saber o que está oculto para este cotista
          window.falhaAcessoConteudo();
        } else {
          window.definirAcessoConteudo({ master: false, ocultos });
        }
      } else {
        window.location.href = "index.html";
      }
    });

    // Lista de cotistas para o master marcar quem vê cada conteúdo
    // (mesmos cadastros da página admin: os que têm e-mail; o master fica de fora porque sempre vê tudo)
    async function montarAcessoMaster(uidMaster) {
      try {
        const snapshot = await getDocs(collection(db, "usuarios"));
        const cotistas = [];

        snapshot.forEach((docSnapshot) => {
          const dados = docSnapshot.data();

          if (!dados.email) return;
          if (docSnapshot.id === uidMaster) return;

          cotistas.push({
            uid: docSnapshot.id,
            nome: dados.nome || "Cotista",
            email: dados.email,
            ocultos: new Set(Array.isArray(dados.conteudosOcultos) ? dados.conteudosOcultos : []),
          });
        });

        cotistas.sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR"));

        return { master: true, cotistas, salvarVisibilidade };
      } catch (error) {
        console.error("Erro ao carregar cotistas:", error);
        return { master: true, cotistas: null, salvarVisibilidade };
      }
    }

    // mudancas: [{ uid, oculto }] — só os cotistas que mudaram para este vídeo
    async function salvarVisibilidade(videoId, mudancas) {
      const batch = writeBatch(db);

      mudancas.forEach(({ uid, oculto }) => {
        batch.update(doc(db, "usuarios", uid), {
          conteudosOcultos: oculto ? arrayUnion(videoId) : arrayRemove(videoId),
        });
      });

      await batch.commit();
    }
  </script>

  <!-- SCRIPT DE BUSCA, RENDERIZAÇÃO E MODAL DOS VÍDEOS -->
  <script>
    const GITHUB_REPO   = "Gaaba97/login-page";
    const GITHUB_BRANCH = "main";
    const CONTEUDO_PATH = "conteudo";
    const RAW_BASE = `https://raw.githubusercontent.com/${GITHUB_REPO}/${GITHUB_BRANCH}/${CONTEUDO_PATH}`;
    const API_URL  = `https://api.github.com/repos/${GITHUB_REPO}/contents/${CONTEUDO_PATH}?ref=${GITHUB_BRANCH}`;

    /* ---- THUMB ----
       Usa o campo "thumb" do JSON se estiver preenchido;
       caso contrário, pega o thumbnail padrão do YouTube. */
    function resolverThumb(video) {
      if (video.thumb && video.thumb.trim() !== "") {
        return video.thumb.trim();
      }
      return `https://img.youtube.com/vi/${video.id}/hqdefault.jpg`;
    }

    function thumbFallback(img, videoId) {
      img.onerror = null;
      img.src = `https://img.youtube.com/vi/${videoId}/mqdefault.jpg`;
    }

    function formatarData(dataStr) {
      if (!dataStr) return "";
      const [ano, mes, dia] = dataStr.split("-");
      if (!ano || !mes || !dia) return dataStr;
      const meses = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
      return `${parseInt(dia)} de ${meses[parseInt(mes) - 1]} de ${ano}`;
    }

    /* ---- MODAL ---- */
    const modal       = document.getElementById("video-modal");
    const modalIframe = document.getElementById("modal-iframe");
    const modalTitulo = document.getElementById("modal-titulo");
    const btnFechar   = document.getElementById("modal-fechar");

    function abrirModal(videoId, titulo) {
      modalTitulo.textContent = titulo || "";
      // autoplay=1 inicia o vídeo automaticamente; rel=0 não mostra sugestões de outros canais
      modalIframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;
      modal.classList.add("aberto");
      document.body.style.overflow = "hidden";
    }

    function fecharModal() {
      modal.classList.remove("aberto");
      modalIframe.src = ""; // zera o src para parar o vídeo
      document.body.style.overflow = "";
    }

    btnFechar.addEventListener("click", fecharModal);

    // Clique no fundo escuro fecha o modal
    modal.addEventListener("click", function(e) {
      if (e.target === modal) fecharModal();
    });

    // Tecla ESC fecha o modal
    document.addEventListener("keydown", function(e) {
      if (e.key === "Escape") fecharModal();
    });

    /* ---- ACESSO ----
       A lista só é exibida depois do login (script do Firebase acima):
       - cotista: { master: false, ocultos: [ids] } → não vê os vídeos ocultos para ele
       - master:  { master: true, cotistas, salvarVisibilidade } → vê tudo e edita quem vê */
    let videosCarregados = null;
    let acessoConteudo = null;

    window.definirAcessoConteudo = function(acesso) {
      acessoConteudo = acesso;
      tentarRenderizar();
    };

    window.falhaAcessoConteudo = function() {
      document.getElementById("conteudo-loading").style.display = "none";
      document.getElementById("conteudo-erro").style.display = "block";
    };

    function tentarRenderizar() {
      if (videosCarregados === null || acessoConteudo === null) return;

      if (acessoConteudo.master) {
        renderVideos(videosCarregados);
      } else {
        const ocultos = new Set(acessoConteudo.ocultos);
        renderVideos(videosCarregados.filter(v => !ocultos.has(v.id)));
      }
    }

    /* ---- VISIBILIDADE (SÓ PARA O MASTER) ---- */
    function criarBlocoVisibilidade(video) {
      const cotistas = acessoConteudo.cotistas;

      const bloco = document.createElement("div");
      bloco.className = "visib-bloco";

      bloco.innerHTML = `
        <div class="visib-barra">
          <span class="visib-resumo"></span>
          <button type="button" class="visib-btn visib-btn-secundario visib-editar" aria-expanded="false">Editar visibilidade</button>
        </div>
        <div class="visib-painel" hidden>
          <div class="visib-botoes">
            <button type="button" class="visib-btn visib-btn-secundario visib-todos">Marcar todos</button>
            <button type="button" class="visib-btn visib-btn-secundario visib-nenhum">Desmarcar todos</button>
          </div>
          <div class="visib-lista"></div>
          <div class="visib-rodape">
            <button type="button" class="visib-btn visib-btn-primario visib-salvar">Salvar</button>
            <span class="visib-contador"></span>
            <span class="visib-status"></span>
          </div>
        </div>
      `;

      const resumo    = bloco.querySelector(".visib-resumo");
      const btnEditar = bloco.querySelector(".visib-editar");
      const painel    = bloco.querySelector(".visib-painel");
      const listaEl   = bloco.querySelector(".visib-lista");
      const btnSalvar = bloco.querySelector(".visib-salvar");
      const contador  = bloco.querySelector(".visib-contador");
      const statusEl  = bloco.querySelector(".visib-status");

      function caixas() {
        return Array.from(listaEl.querySelectorAll("input[type=checkbox]"));
      }

      // Resumo do que está salvo
      function atualizarResumo() {
        const total = cotistas.length;
        const visiveis = cotistas.filter(c => !c.ocultos.has(video.id)).length;

        resumo.className = "visib-resumo";

        if (total === 0) {
          resumo.textContent = "Nenhum cotista cadastrado";
        } else if (visiveis === total) {
          resumo.textContent = "Visível para todos os cotistas";
        } else if (visiveis === 0) {
          resumo.textContent = "Oculto para todos os cotistas";
          resumo.classList.add("nenhum");
        } else {
          resumo.textContent = `Visível para ${visiveis} de ${total} cotistas`;
          resumo.classList.add("parcial");
        }
      }

      // Quantos estão marcados agora no painel (antes de salvar)
      function atualizarContador() {
        const marcadas = caixas().filter(cb => cb.checked).length;
        contador.textContent = `${marcadas} de ${cotistas.length} marcados`;
      }

      function mostrarStatus(texto, tipo) {
        statusEl.textContent = texto;
        statusEl.className = tipo ? `visib-status ${tipo}` : "visib-status";
      }

      // Marcado = o cotista vê o conteúdo
      function preencherLista() {
        listaEl.innerHTML = "";

        cotistas.forEach((cotista) => {
          const linha = document.createElement("label");
          linha.className = "visib-cotista";

          const caixa = document.createElement("input");
          caixa.type = "checkbox";
          caixa.dataset.uid = cotista.uid;
          caixa.checked = !cotista.ocultos.has(video.id);

          const info = document.createElement("div");

          const nome = document.createElement("div");
          nome.className = "visib-nome";
          nome.textContent = cotista.nome;

          const email = document.createElement("div");
          email.className = "visib-email";
          email.textContent = cotista.email;

          info.append(nome, email);
          linha.append(caixa, info);
          listaEl.appendChild(linha);
        });

        atualizarContador();
      }

      btnEditar.addEventListener("click", () => {
        const abrir = painel.hidden;

        if (abrir) {
          preencherLista(); // descarta o que não foi salvo
          mostrarStatus("", "");
        }

        painel.hidden = !abrir;
        btnEditar.textContent = abrir ? "Fechar" : "Editar visibilidade";
        btnEditar.setAttribute("aria-expanded", String(abrir));
      });

      bloco.querySelector(".visib-todos").addEventListener("click", () => {
        caixas().forEach(cb => { cb.checked = true; });
        atualizarContador();
      });

      bloco.querySelector(".visib-nenhum").addEventListener("click", () => {
        caixas().forEach(cb => { cb.checked = false; });
        atualizarContador();
      });

      listaEl.addEventListener("change", atualizarContador);

      btnSalvar.addEventListener("click", async () => {
        const porUid = new Map(cotistas.map(c => [c.uid, c]));
        const mudancas = [];

        caixas().forEach((cb) => {
          const cotista = porUid.get(cb.dataset.uid);
          const oculto = !cb.checked;

          if (cotista && cotista.ocultos.has(video.id) !== oculto) {
            mudancas.push({ uid: cotista.uid, oculto });
          }
        });

        if (mudancas.length === 0) {
          mostrarStatus("Nenhuma alteração para salvar.", "");
          return;
        }

        btnSalvar.disabled = true;
        btnSalvar.textContent = "Salvando...";
        mostrarStatus("", "");

        try {
          await acessoConteudo.salvarVisibilidade(video.id, mudancas);

          mudancas.forEach(({ uid, oculto }) => {
            const cotista = porUid.get(uid);
            if (oculto) cotista.ocultos.add(video.id);
            else cotista.ocultos.delete(video.id);
          });

          atualizarResumo();
          mostrarStatus("Salvo.", "ok");
        } catch (err) {
          console.error("Erro ao salvar visibilidade:", err);
          mostrarStatus(
            err && err.code === "permission-denied"
              ? "Sem permissão para salvar. Confira as regras do Firestore."
              : "Não foi possível salvar. Tente novamente.",
            "erro"
          );
        } finally {
          btnSalvar.disabled = false;
          btnSalvar.textContent = "Salvar";
        }
      });

      atualizarResumo();
      return bloco;
    }

    /* ---- RENDERIZAÇÃO ---- */
    function renderVideos(videos) {
      const lista = document.getElementById("conteudo-lista");
      document.getElementById("conteudo-loading").style.display = "none";
      lista.innerHTML = "";

      if (!videos || videos.length === 0) {
        lista.innerHTML = '<p style="text-align:center;color:#888;padding:40px 0;">Nenhum conteúdo disponível.</p>';
        return;
      }

      const ehMaster = Boolean(acessoConteudo && acessoConteudo.master);
      const editarVisibilidade = ehMaster && Array.isArray(acessoConteudo.cotistas);

      if (ehMaster && !editarVisibilidade) {
        const aviso = document.createElement("p");
        aviso.className = "visib-aviso";
        aviso.textContent = "Não foi possível carregar os cotistas para editar a visibilidade.";
        lista.appendChild(aviso);
      }

      videos.forEach((video, index) => {
        const thumb = resolverThumb(video);

        const card = document.createElement("div");
        card.className = "video-card";
        card.setAttribute("role", "button");
        card.setAttribute("tabindex", "0");

        card.innerHTML = `
          <div class="thumb-wrapper">
            <img
              class="video-thumb"
              src="${thumb}"
              alt="${video.titulo || ''}"
              onerror="thumbFallback(this, '${video.id}')"
            />
            <div class="play-icon">
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <polygon points="5,3 19,12 5,21"/>
              </svg>
            </div>
          </div>
          <div class="video-info">
            <p class="video-titulo">${video.titulo || ""}</p>
            ${video.descricao ? `<p class="video-descricao">${video.descricao}</p>` : ""}
            ${video.data ? `<p class="video-data">${formatarData(video.data)}</p>` : ""}
          </div>
        `;

        card.addEventListener("click", () => abrirModal(video.id, video.titulo));
        card.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") abrirModal(video.id, video.titulo);
        });

        lista.appendChild(card);

        if (editarVisibilidade) {
          lista.appendChild(criarBlocoVisibilidade(video));
        }

        // linha divisória fina entre os vídeos (não após o último)
        if (index < videos.length - 1) {
          const hr = document.createElement("hr");
          hr.className = "video-divider";
          lista.appendChild(hr);
        }
      });
    }

    /* ---- BUSCA NO GITHUB ---- */
    async function carregarVideos() {
      try {
        const res = await fetch(API_URL);
        if (!res.ok) throw new Error("Falha ao listar arquivos");

        const arquivos = await res.json();

        // Pega apenas .json com nome numérico e ordena do maior para o menor
        const jsonFiles = arquivos
          .filter(f => f.name.endsWith(".json") && !isNaN(parseInt(f.name)))
          .sort((a, b) => parseInt(b.name) - parseInt(a.name));

        if (jsonFiles.length === 0) {
          videosCarregados = [];
          tentarRenderizar();
          return;
        }

        // Busca cada arquivo em paralelo
        const promises = jsonFiles.map(f =>
          fetch(`${RAW_BASE}/${f.name}`)
            .then(r => r.ok ? r.json() : null)
            .catch(() => null)
        );

        const resultados = await Promise.all(promises);

        // Cada JSON pode ser array ou objeto — normaliza para lista plana
        const videos = resultados
          .filter(Boolean)
          .flatMap(r => Array.isArray(r) ? r : [r])
          .filter(v => v && v.id);

        videosCarregados = videos;
        tentarRenderizar();

      } catch (err) {
        console.error("Erro ao carregar vídeos:", err);
        document.getElementById("conteudo-loading").style.display = "none";
        document.getElementById("conteudo-erro").style.display = "block";
      }
    }

    carregarVideos();
  </script>

  <script>
    // SCRIPT DE DETECÇÃO DE DISPOSITIVO
    let orientationChangeTimeout;

    function detectarDispositivo() {
      const largura = window.innerWidth;
      const altura = window.innerHeight;
      const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
      
      const isMobileSize = largura <= 1024 || 
                          (largura < altura && largura <= 768) ||
                          (isTouchDevice && (largura <= 1024 || altura <= 1024));

      document.body.classList.remove('desktop-device', 'mobile-device', 'mobile-landscape');

      if (isMobileSize && isTouchDevice) {
        if (largura > altura) {
          document.body.classList.add('mobile-device', 'mobile-landscape');
        } else {
          document.body.classList.add('mobile-device');
        }
      } else {
        document.body.classList.add('desktop-device');
      }
    }

    window.addEventListener('resize', function() {
      clearTimeout(orientationChangeTimeout);
      orientationChangeTimeout = setTimeout(detectarDispositivo, 250);
    });

    window.addEventListener('orientationchange', function() {
      clearTimeout(orientationChangeTimeout);
      orientationChangeTimeout = setTimeout(detectarDispositivo, 500);
    });
    
    setTimeout(detectarDispositivo, 100);
    detectarDispositivo();
  </script>

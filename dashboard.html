  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: "DM Sans", sans-serif;
      background-color: white;
      color: black;
      display: flex;
      flex-direction: column;
    }

    /* ── NAVBAR ── */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: rgba(0, 0, 0, 0.9);
      padding: 10px 20px;
      position: fixed;
      width: 100%;
      top: 0;
      left: 0;
      z-index: 10;
      color: white;
      box-sizing: border-box;
    }

    .navbar .welcome {
      font-weight: bold;
      white-space: nowrap;
      font-size: 16px;
    }

    .navbar .links {
      display: flex;
      gap: 20px;
      flex-wrap: nowrap;
      white-space: nowrap;
      padding-left: 4px;
    }

    .navbar a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
      display: inline-block;
      transition: transform 0.2s ease-in-out;
    }

    .navbar a:hover {
      transform: scale(1.1);
      color: white;
    }

    /* ── TICKER TAPE ── */
    /*
     * O widget do TradingView usa iframe interno com scroll próprio.
     * Qualquer transform no container-pai desalinha o cálculo de
     * largura do iframe e quebra a animação de rolagem.
     * Solução: controlar apenas height + overflow, sem transform.
     *
     * Desktop  → altura 37px  (widget nasce com 46px, cortamos 9px no topo – invisível)
     * Mobile V → altura 46px  (tamanho natural, nada cortado)
     */
    .ticker-wrapper {
      position: fixed;
      top: 45px;
      left: 0;
      width: 100%;
      z-index: 9;
      overflow: hidden;
      background-color: #fff;
    }

    /* altura base (mobile fallback) */
    .ticker-wrapper,
    .ticker-wrapper .tradingview-widget-container,
    .ticker-wrapper .tradingview-widget-container__widget {
      height: 46px;
    }

    /* ── DESKTOP ── */
    .desktop-device .ticker-wrapper  { top: 45px;  height: 37px; }
    .desktop-device .navbar           { padding: 10px 20px; }
    .desktop-device .navbar .welcome  { font-size: 16px; }
    .desktop-device .navbar .links    { gap: 20px; }
    .desktop-device .navbar a         { font-size: 16px; }

    /* ── SMARTPHONE VERTICAL ── */
    .mobile-device .navbar            { padding: 18px 20px; min-height: 75px; }
    .mobile-device .navbar .welcome   { font-size: 24px; font-weight: bold; }
    .mobile-device .navbar .links     { gap: 20px; }
    .mobile-device .navbar a          { font-size: 24px; font-weight: bold; }
    .mobile-device .ticker-wrapper    { top: 75px; height: 46px; }

    /* ── SMARTPHONE HORIZONTAL ── */
    .mobile-landscape .navbar         { padding: 12px 20px; }
    .mobile-landscape .navbar .welcome{ font-size: 18px; }
    .mobile-landscape .navbar .links  { gap: 15px; }
    .mobile-landscape .navbar a       { font-size: 18px; }
    .mobile-landscape .ticker-wrapper { top: 54px; height: 46px; }

    @media (max-width: 768px) {
      .navbar            { padding: 8px 15px; }
      .navbar .welcome   { font-size: 14px; }
      .navbar .links     { gap: 10px; }
      .navbar a          { font-size: 14px; }
      .ticker-wrapper    { top: 40px; }
    }

    /* ── CONTEÚDO PRINCIPAL ── */
    .main-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-top: 91px;
      box-sizing: border-box;
    }

    .desktop-device .main-wrapper    { padding-top: 82px; }
    .mobile-device .main-wrapper     { padding-top: 121px; }
    .mobile-landscape .main-wrapper  { padding-top: 100px; }

    /* ── PÁGINA EM MANUTENÇÃO ── */
    .manutencao-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      gap: 20px;
    }

    .manutencao-icon {
      font-size: 64px;
      animation: girar 3s linear infinite;
    }

    @keyframes girar {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .manutencao-titulo {
      font-size: 28px;
      font-weight: 700;
      margin: 0;
      color: #000;
    }

    .manutencao-subtitulo {
      font-size: 16px;
      font-weight: 400;
      color: #555;
      margin: 0;
      max-width: 380px;
      line-height: 1.6;
    }

    .manutencao-linha {
      width: 60px;
      height: 3px;
      background-color: #000;
      border-radius: 2px;
    }

    /* OCULTAR INFORMAÇÃO DO DISPOSITIVO */
    #deviceInfo { display: none !important; }
  </style>

  <!-- ══ FIREBASE AUTH ══ -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged,
    } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
    import {
      getFirestore,
      doc,
      getDoc,
    } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAYLyEfTVl8zR1drcNYi7K33IT6ytVJYJ8",
      authDomain: "login-site-9cbbd.firebaseapp.com",
      projectId: "login-site-9cbbd",
      storageBucket: "login-site-9cbbd.appspot.com",
      messagingSenderId: "703993528666",
      appId: "1:703993528666:web:1e7a02cb5b611e24c97363",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        try {
          const docRef = doc(db, "usuarios", user.uid);
          const docSnap = await getDoc(docRef);
          if (docSnap.exists()) {
            const data = docSnap.data();
            const nome = data.nome || "Usuário";
            const genero = (data.genero || "masculino").toLowerCase();
            const saudacao = genero === "feminino" ? "Bem-vinda" : "Bem-vindo";
            document.getElementById("welcomeUser").textContent = `${saudacao}, ${nome}`;
          } else {
            document.getElementById("welcomeUser").textContent = "Bem-vindo(a), Usuário";
          }
        } catch (error) {
          document.getElementById("welcomeUser").textContent = "Bem-vindo(a), Usuário";
        }
      } else {
        window.location.href = "index.html";
      }
    });
  </script>

  <!-- ══ DETECÇÃO DE DISPOSITIVO ══ -->
  <script>
    let orientationChangeTimeout;

    function detectarDispositivo() {
      const largura = window.innerWidth;
      const altura = window.innerHeight;
      const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

      const isMobileSize = largura <= 1024 ||
                           (largura < altura && largura <= 768) ||
                           (isTouchDevice && (largura <= 1024 || altura <= 1024));

      document.body.classList.remove('desktop-device', 'mobile-device', 'mobile-landscape');

      if (isMobileSize && isTouchDevice) {
        if (largura > altura) {
          document.body.classList.add('mobile-device', 'mobile-landscape');
        } else {
          document.body.classList.add('mobile-device');
        }
      } else {
        document.body.classList.add('desktop-device');
      }
    }

    window.addEventListener('resize', function () {
      clearTimeout(orientationChangeTimeout);
      orientationChangeTimeout = setTimeout(detectarDispositivo, 250);
    });

    window.addEventListener('orientationchange', function () {
      clearTimeout(orientationChangeTimeout);
      orientationChangeTimeout = setTimeout(detectarDispositivo, 500);
    });

    setTimeout(detectarDispositivo, 100);
    detectarDispositivo();
  </script>

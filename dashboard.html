<!DOCTYPE html>
<html lang="pt-br">
<head>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: "DM Sans", sans-serif;
      background-color: white;
      color: black;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      overscroll-behavior-x: none;
    }

    /* ── NAVBAR ── */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: rgba(0, 0, 0, 0.9);
      padding: 10px 20px;
      position: fixed;
      width: 100%;
      top: 0;
      left: 0;
      z-index: 20;
      color: white;
    }

    .navbar .welcome {
      font-weight: bold;
      white-space: nowrap;
      font-size: 16px;
    }

    .navbar .links {
      display: flex;
      gap: 20px;
      flex-wrap: nowrap;
      white-space: nowrap;
    }

    .navbar a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
      transition: transform 0.2s ease;
    }

    .navbar a:hover {
      transform: scale(1.1);
    }

    /* ── TICKER ── */
    .ticker-wrapper {
      position: fixed;
      top: 45px;
      left: 0;
      width: 100%;
      height: 46px;
      z-index: 15;
      background: white;
      overflow: hidden;
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }

    .ticker-track {
      display: flex;
      width: max-content;
      height: 100%;
      animation: tickerMove 45s linear infinite;
      will-change: transform;
    }

    .ticker-item {
      flex: 0 0 auto;
      width: max(1800px, 220vw);
      height: 46px;
      overflow: hidden;
    }

    .tradingview-widget-container,
    .tradingview-widget-container__widget {
      width: 100%;
      height: 100%;
    }

    @keyframes tickerMove {
      from {
        transform: translateX(0);
      }
      to {
        transform: translateX(-50%);
      }
    }

    /* ── MAIN ── */
    .main-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .desktop-device .main-wrapper   { padding-top: calc(45px + 46px + 37px); }
    .mobile-device .main-wrapper    { padding-top: calc(75px + 46px + 37px); }
    .mobile-landscape .main-wrapper { padding-top: calc(54px + 46px + 37px); }

    /* ── MANUTENÇÃO ── */
    .manutencao-container {
      text-align: center;
      padding: 40px 20px;
      gap: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .manutencao-icon {
      font-size: 64px;
      animation: girar 3s linear infinite;
    }

    @keyframes girar {
      100% { transform: rotate(360deg); }
    }

    .manutencao-titulo {
      font-size: 28px;
      font-weight: 700;
    }

    .manutencao-subtitulo {
      font-size: 16px;
      color: #555;
      max-width: 380px;
      line-height: 1.6;
    }

    .manutencao-linha {
      width: 60px;
      height: 3px;
      background: black;
      border-radius: 2px;
    }

    #deviceInfo { display: none; }

    /* ── AJUSTES POR DISPOSITIVO ── */
    .desktop-device .ticker-wrapper { top: 45px; }
    .mobile-device .navbar          { padding: 18px 20px; min-height: 75px; }
    .mobile-device .navbar .welcome { font-size: 24px; }
    .mobile-device .navbar a        { font-size: 24px; }
    .mobile-device .ticker-wrapper  { top: 75px; height: 46px; }

    .mobile-landscape .navbar         { padding: 12px 20px; }
    .mobile-landscape .navbar .welcome { font-size: 18px; }
    .mobile-landscape .navbar a        { font-size: 18px; }
    .mobile-landscape .ticker-wrapper  { top: 54px; height: 46px; }

    /* Em telas menores, deixa a faixa ainda mais larga para garantir que tudo apareça */
    @media (max-width: 768px) {
      .ticker-item {
        width: max(2000px, 260vw);
      }

      .ticker-track {
        animation-duration: 55s;
      }
    }
  </style>
</head>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAYLyEfTVl8zR1drcNYi7K33IT6ytVJYJ8",
      authDomain: "login-site-9cbbd.firebaseapp.com",
      projectId: "login-site-9cbbd",
      storageBucket: "login-site-9cbbd.appspot.com",
      messagingSenderId: "703993528666",
      appId: "1:703993528666:web:1e7a02cb5b611e24c97363",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        try {
          const docSnap = await getDoc(doc(db, "usuarios", user.uid));
          if (docSnap.exists()) {
            const data = docSnap.data();
            const nome = data.nome || "Usuário";
            const genero = (data.genero || "masculino").toLowerCase();
            const saudacao = genero === "feminino" ? "Bem-vinda" : "Bem-vindo";
            document.getElementById("welcomeUser").textContent = `${saudacao}, ${nome}`;
          } else {
            document.getElementById("welcomeUser").textContent = "Bem-vindo(a), Usuário";
          }
        } catch {
          document.getElementById("welcomeUser").textContent = "Bem-vindo(a), Usuário";
        }
      } else {
        window.location.href = "index.html";
      }
    });
  </script>

  <!-- DETECÇÃO DE DISPOSITIVO -->
  <script>
    let timeout;
    function detectarDispositivo() {
      const largura = window.innerWidth;
      const altura = window.innerHeight;
      const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
      const isMobile = largura <= 1024 || (largura < altura && largura <= 768) || (isTouch && (largura <= 1024 || altura <= 1024));

      document.body.classList.remove('desktop-device', 'mobile-device', 'mobile-landscape');
      if (isMobile && isTouch) {
        if (largura > altura) document.body.classList.add('mobile-device', 'mobile-landscape');
        else document.body.classList.add('mobile-device');
      } else {
        document.body.classList.add('desktop-device');
      }
    }

    window.addEventListener('resize', () => {
      clearTimeout(timeout);
      timeout = setTimeout(detectarDispositivo, 250);
    });

    window.addEventListener('orientationchange', () => {
      clearTimeout(timeout);
      timeout = setTimeout(detectarDispositivo, 500);
    });

    detectarDispositivo();
  </script>

  <!-- GARANTE SEM BARRA E REFORÇA O REAJUSTE -->
